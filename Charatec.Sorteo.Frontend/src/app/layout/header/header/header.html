
<header class="site-header">

  <!-- BARRA NEGRA SUPERIOR -->
  <div class="main-header">
    <div class="container header-content">
      <span class="header-tag">
        Tu próxima oportunidad comienza aquí
      </span>
    </div>
  </div>

  <!-- NAVBAR AZUL -->
  <nav class="navbar" aria-label="Navegación principal">

    <div class="container nav-content">

      <!-- LOGO -->
      <a
        routerLink="/home"
        class="logo"
        aria-label="Corporación Charatec - Inicio"
        (click)="cerrarMenu()"
      >
        <img
          src="/images/corporacion_charatec_logo.png"
          alt="Corporación Charatec"
          class="logo-image"
        />
      </a>

      <!-- NAVEGACIÓN CENTRAL -->
      <div
        id="main-navigation"
        class="nav-links"
        [class.nav-open]="menuAbierto()"
      >

        <a
          routerLink="/home"
          routerLinkActive="active"
          (click)="cerrarMenu()"
        >
          Inicio
        </a>

        @if (!sesionService.autenticado()) {
          <a
            routerLink="/registro"
            routerLinkActive="active"
            (click)="cerrarMenu()"
          >
            Crear cuenta
          </a>
        }

        <span class="nav-upcoming">
          Sorteos próximamente
        </span>

        <span class="nav-upcoming">
          Suscripciones próximamente
        </span>

      </div>

      <!-- BOTONES DERECHOS -->
      <div class="nav-actions">

        <!-- CARRITO -->
        <button
          type="button"
          class="nav-icon-button cart-button"
          aria-label="Mi carrito - Próximamente"
          title="Mi carrito - Próximamente"
          disabled
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
            ></path>
          </svg>
        </button>

        <!-- SIN TOKEN: INICIAR SESIÓN -->
        @if (!sesionService.autenticado()) {

          <a
            routerLink="/login"
            class="nav-icon-button"
            aria-label="Iniciar sesión"
            title="Iniciar sesión"
            (click)="cerrarMenu()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"></path>
            </svg>
          </a>

        } @else {

          <!-- CON TOKEN: USUARIO -->
          <a
            routerLink="/home"
            class="nav-icon-button"
            aria-label="Mi cuenta"
            title="Mi cuenta"
            (click)="cerrarMenu()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
            </svg>
          </a>

          <!-- CON TOKEN: CERRAR SESIÓN -->
          <button
            type="button"
            class="nav-icon-button logout-button"
            (click)="cerrarSesion()"
            aria-label="Cerrar sesión"
            title="Cerrar sesión"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M12 3h6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h6"></path>
            </svg>
          </button>

        }

        <!-- MENÚ MÓVIL -->
        <button
          type="button"
          class="menu-toggle"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto()"
          aria-controls="main-navigation"
          aria-label="Abrir o cerrar menú"
        >
          ☰
        </button>

      </div>

    </div>
  </nav>

</header>
