
<header class="site-header">

  <!-- BARRA NEGRA SUPERIOR -->
  <div class="main-header">
    <div class="container header-content">
      <span class="header-tag">
        Tu próxima oportunidad comienza aquí
      </span>
    </div>
  </div>

  <!-- NAVBAR AZUL -->
  <nav class="navbar" aria-label="Navegación principal">

    <div class="container nav-content">

      <!-- LOGO IZQUIERDO -->
      <a
        routerLink="/home"
        class="logo"
        aria-label="Corporación Charatec - Inicio"
        (click)="cerrarMenu()"
      >
        <img
          src="/images/corporacion_charatec_logo.png"
          alt="Corporación Charatec"
          class="logo-image"
        />
      </a>

      <!-- ENLACES CENTRALES -->
      <div
        id="main-navigation"
        class="nav-links"
        [class.nav-open]="menuAbierto()"
      >

        <a
          routerLink="/home"
          routerLinkActive="active"
          (click)="cerrarMenu()"
        >
          Inicio
        </a>

        <a
          routerLink="/registro"
          routerLinkActive="active"
          (click)="cerrarMenu()"
        >
          Crear cuenta
        </a>

        <a
          routerLink="/login"
          routerLinkActive="active"
          (click)="cerrarMenu()"
        >
          Iniciar sesión
        </a>

        <span class="nav-upcoming">
          Sorteos próximamente
        </span>

        <span class="nav-upcoming">
          Suscripciones próximamente
        </span>

      </div>

      <!-- ACCIONES DERECHAS -->
      <div class="nav-actions">

        <!-- CARRITO -->
        <button
          type="button"
          class="cart-button"
          aria-label="Mi carrito - Próximamente"
          title="Mi carrito - Próximamente"
          disabled
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2
              1.61h9.72a2 2 0 0 0 2-1.61L23
              6H6"
            ></path>
          </svg>
        </button>

        <!-- MENÚ MÓVIL -->
        <button
          type="button"
          class="menu-toggle"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto()"
          aria-controls="main-navigation"
          aria-label="Abrir o cerrar menú"
        >
          ☰
        </button>

      </div>

    </div>

  </nav>

</header>
